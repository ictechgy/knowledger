name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run check
      - run: npm run demo
      - run: npm run demo:kb
      - run: npm run config:init -- --output /tmp/knowledger-ci.json
      - run: node infra/fabric/build.mjs --config /tmp/knowledger-ci.json --output /tmp/knowledger-chaincode
  fabric-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund
      - run: npm ci --prefix packages/fabric --ignore-scripts --no-fund
      - run: npm ci --prefix packages/auth --ignore-scripts --no-fund
      - run: npm run check:types
      - run: node --test 'test/fabric/*.test.ts' 'test/auth/*.test.ts' 'test/api/*.test.ts'
      # local-runtime은 선택적 fabric 의존성을 설치하지 않아 fabric 비교 테스트가 skip된다 —
      # 이 job에서 performance-fabric CLI의 baseline 비교 경로를 실제로 검증한다.
      - run: node --test 'test/automation/experiments.test.ts'

  browser-and-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix packages/browser-tests --ignore-scripts --no-fund
      - run: node packages/browser-tests/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:performance -- --documents 25 --samples 3
      - run: npm run test:history-performance
      - run: npm run test:resilience
      - run: npm run test:backup
      - run: npm run test:drill:multi-host
